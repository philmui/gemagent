<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Google ADK runtime inside the Voice Lab backend</title>
  <desc id="desc">FastAPI holds one reusable Gemini model, Agent, App, Runner, and in-memory session service. Each accepted browser WebSocket creates random identities, a new ADK session, a bounded live queue, and two cancellable streaming tasks before deleting the session on exit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101425"/><stop offset="1" stop-color="#1d2039"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a391ff"/><stop offset="1" stop-color="#6a56db"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9d8bff"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,system-ui,sans-serif">
    <text x="54" y="56" fill="#f6f5ff" font-size="26" font-weight="750">Reusable ADK runtime with isolated live sessions</text>
    <text x="54" y="84" fill="#adb6d2" font-size="15">Long-lived framework objects reduce setup cost. Short-lived session objects prevent conversation crossover.</text>

    <rect x="50" y="118" width="1100" height="178" rx="22" fill="#222642" stroke="#4d5778"/>
    <rect x="70" y="138" width="206" height="30" rx="15" fill="#343957"/>
    <text x="173" y="158" text-anchor="middle" fill="#d8dcec" font-size="12" font-weight="800" letter-spacing=".8">APPLICATION SCOPE</text>
    <g filter="url(#shadow)">
      <rect x="76" y="195" width="176" height="72" rx="15" fill="#29284d" stroke="#7665de"/>
      <text x="164" y="223" text-anchor="middle" fill="#f5f2ff" font-size="14" font-weight="700">Gemini model client</text>
      <text x="164" y="247" text-anchor="middle" fill="#b9b1e1" font-size="11">Vertex AI ADC, us-central1</text>
      <rect x="288" y="195" width="150" height="72" rx="15" fill="#29284d" stroke="#7665de"/>
      <text x="363" y="223" text-anchor="middle" fill="#f5f2ff" font-size="14" font-weight="700">ADK Agent</text>
      <text x="363" y="247" text-anchor="middle" fill="#b9b1e1" font-size="11">voice instruction</text>
      <rect x="474" y="195" width="126" height="72" rx="15" fill="#29284d" stroke="#7665de"/>
      <text x="537" y="223" text-anchor="middle" fill="#f5f2ff" font-size="14" font-weight="700">ADK App</text>
      <text x="537" y="247" text-anchor="middle" fill="#b9b1e1" font-size="11">gemini_voice</text>
      <rect x="636" y="195" width="145" height="72" rx="15" fill="#29284d" stroke="#7665de"/>
      <text x="708" y="223" text-anchor="middle" fill="#f5f2ff" font-size="14" font-weight="700">ADK Runner</text>
      <text x="708" y="247" text-anchor="middle" fill="#b9b1e1" font-size="11">run_live</text>
      <rect x="817" y="195" width="307" height="72" rx="15" fill="#1c233a" stroke="#4b5779"/>
      <text x="970" y="223" text-anchor="middle" fill="#f1f3ff" font-size="14" font-weight="700">In-memory session service</text>
      <text x="970" y="247" text-anchor="middle" fill="#aeb8d3" font-size="11">process-local · deleted on exit</text>
    </g>
    <path d="M252 231h36M438 231h36M600 231h36M781 231h36" stroke="#9d8bff" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="50" y="326" width="1100" height="274" rx="22" fill="#202641" stroke="#6558ba"/>
    <rect x="70" y="346" width="244" height="30" rx="15" fill="#493f8d"/>
    <text x="192" y="366" text-anchor="middle" fill="#fff" font-size="12" font-weight="800" letter-spacing=".8">ONE WEBSOCKET SESSION</text>
    <g filter="url(#shadow)">
      <rect x="76" y="407" width="180" height="158" rx="17" fill="#181d33" stroke="#404968"/>
      <text x="166" y="437" text-anchor="middle" fill="#f4f3ff" font-size="14" font-weight="700">Browser WebSocket</text>
      <path d="M111 476c8-17 16 17 24 0s16 17 24 0 16 17 24 0" fill="none" stroke="#a18eff" stroke-width="3" stroke-linecap="round"/>
      <text x="166" y="510" text-anchor="middle" fill="#aeb8d3" font-size="11">PCM16 · 16 kHz</text>
      <text x="166" y="532" text-anchor="middle" fill="#aeb8d3" font-size="11">exact Origin + voice</text>
      <rect x="294" y="407" width="182" height="158" rx="17" fill="#25264a" stroke="#6959ca"/>
      <text x="385" y="437" text-anchor="middle" fill="#f4f1ff" font-size="14" font-weight="700">Generated identity</text>
      <text x="385" y="471" text-anchor="middle" fill="#c5bdf0" font-size="12">random user ID</text>
      <text x="385" y="495" text-anchor="middle" fill="#c5bdf0" font-size="12">random session ID</text>
      <text x="385" y="531" text-anchor="middle" fill="#9f91ef" font-size="11" font-weight="700">not browser supplied</text>
      <rect x="514" y="407" width="196" height="158" rx="17" fill="#25264a" stroke="#6959ca"/>
      <text x="612" y="437" text-anchor="middle" fill="#f4f1ff" font-size="14" font-weight="700">Bounded live queue</text>
      <rect x="548" y="466" width="18" height="44" rx="5" fill="#8f7bf2"/><rect x="573" y="456" width="18" height="54" rx="5" fill="#7d6cda"/><rect x="598" y="445" width="18" height="65" rx="5" fill="#6d5fc3"/><rect x="623" y="470" width="18" height="40" rx="5" fill="#5e53ab"/><rect x="648" y="480" width="18" height="30" rx="5" fill="#4f4894"/>
      <text x="612" y="535" text-anchor="middle" fill="#b9b1e1" font-size="11">awaited backpressure</text>
      <rect x="748" y="407" width="184" height="158" rx="17" fill="#25264a" stroke="#6959ca"/>
      <text x="840" y="437" text-anchor="middle" fill="#f4f1ff" font-size="14" font-weight="700">RunConfig</text>
      <text x="840" y="469" text-anchor="middle" fill="#c5bdf0" font-size="11">bidirectional audio + voice</text>
      <text x="840" y="492" text-anchor="middle" fill="#c5bdf0" font-size="11">input + output captions</text>
      <text x="840" y="515" text-anchor="middle" fill="#c5bdf0" font-size="11">compression · no blob storage</text>
      <rect x="970" y="407" width="154" height="158" rx="17" fill="#193536" stroke="#318d81"/>
      <text x="1047" y="437" text-anchor="middle" fill="#effffb" font-size="14" font-weight="700">Two tasks</text>
      <text x="1047" y="472" text-anchor="middle" fill="#a6d4cd" font-size="11">browser to ADK</text>
      <text x="1047" y="496" text-anchor="middle" fill="#a6d4cd" font-size="11">ADK to browser</text>
      <text x="1047" y="531" text-anchor="middle" fill="#59e1c5" font-size="11" font-weight="700">cancel + await</text>
    </g>
    <path d="M256 486h38M476 486h38M710 486h38M932 486h38" stroke="#9d8bff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 296v29" fill="none" stroke="#9d8bff" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="50" y="627" width="1100" height="41" rx="20" fill="#191e33"/>
    <text x="600" y="653" text-anchor="middle" fill="#b8c0d8" font-size="12">Every exit path closes the queue, cancels tasks, deletes the ADK session, and closes the WebSocket</text>
  </g>
</svg>

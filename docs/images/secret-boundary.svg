<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Voice Lab credential and audio privacy boundaries</title>
  <desc id="desc">Google authentication is resolved through Application Default Credentials in the backend identity boundary, while the OpenAI standard key remains in FastAPI. Gemini audio crosses the backend through Google ADK. OpenAI audio goes directly from the browser to OpenAI over WebRTC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101425"/><stop offset="1" stop-color="#1c2039"/></linearGradient>
    <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9c8cff"/></marker>
    <marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59e1c5"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c96b4"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,system-ui,sans-serif">
    <text x="54" y="57" fill="#f6f5ff" font-size="26" font-weight="750">Durable credentials stay behind the backend boundary</text>
    <text x="54" y="85" fill="#adb6d2" font-size="15">Gemini audio is relayed. OpenAI WebRTC media goes directly to the provider.</text>

    <g filter="url(#shadow)">
      <rect x="54" y="126" width="286" height="376" rx="22" fill="#202641" stroke="#414b70"/>
      <text x="82" y="164" fill="#f5f3ff" font-size="19" font-weight="750">Browser boundary</text>
      <text x="82" y="188" fill="#acb6d3" font-size="12">Public code and temporary session state</text>
      <rect x="80" y="220" width="234" height="64" rx="14" fill="#171c31"/>
      <text x="100" y="247" fill="#dcd9ed" font-size="13" font-weight="700">NEXT_PUBLIC_BACKEND_URL</text>
      <text x="100" y="267" fill="#8f9ab9" font-size="11">Safe to include in browser bundle</text>
      <rect x="80" y="303" width="234" height="72" rx="14" fill="#292244" stroke="#6252b9"/>
      <text x="100" y="331" fill="#d8d0ff" font-size="13" font-weight="700">Gemini PCM audio</text>
      <text x="100" y="354" fill="#aaa2d5" font-size="11">Sent through backend WebSocket</text>
      <rect x="80" y="394" width="234" height="82" rx="14" fill="#173235" stroke="#287f74"/>
      <text x="100" y="422" fill="#c9f8ef" font-size="13" font-weight="700">OpenAI client secret</text>
      <text x="100" y="445" fill="#9fcfc7" font-size="11">Short-lived and memory-only</text>
      <text x="100" y="463" fill="#9fcfc7" font-size="11">WebRTC media goes direct</text>

      <rect x="457" y="126" width="300" height="376" rx="22" fill="#232844" stroke="#596385"/>
      <text x="485" y="164" fill="#f5f3ff" font-size="19" font-weight="750">FastAPI trusted boundary</text>
      <text x="485" y="188" fill="#acb6d3" font-size="12">Root .env locally, Secret Manager in cloud</text>
      <rect x="483" y="220" width="248" height="123" rx="16" fill="#25264a" stroke="#6858c7"/>
      <path d="M522 237l19 19-19 19-19-19z" fill="none" stroke="#a895ff" stroke-width="3"/>
      <text x="559" y="249" fill="#dad4ff" font-size="13" font-weight="700">Gemini ADC + ADK</text>
      <text x="559" y="274" fill="#b9b1e1" font-size="11">Vertex AI identity via ADC</text>
      <text x="559" y="295" fill="#b9b1e1" font-size="11">Audio relayed in memory</text>
      <text x="559" y="316" fill="#a895ff" font-size="11" font-weight="700">Live blobs are not saved</text>
      <rect x="483" y="365" width="248" height="111" rx="16" fill="#1a1e34" stroke="#8e7644"/>
      <text x="507" y="394" fill="#f4e2b7" font-size="13" font-weight="700">OpenAI client-secret broker</text>
      <text x="507" y="418" fill="#c1b28e" font-size="11">Standard key stays server-side</text>
      <text x="507" y="439" fill="#c1b28e" font-size="11">Mints a 60-second client secret</text>
      <text x="507" y="460" fill="#f2c86f" font-size="11" font-weight="700">Standard key is never returned</text>

      <rect x="874" y="126" width="272" height="160" rx="22" fill="#29284d" stroke="#7968e3"/>
      <text x="902" y="164" fill="#f5f3ff" font-size="19" font-weight="750">Google</text>
      <text x="902" y="192" fill="#b7afd9" font-size="12">Gemini Live receives audio</text>
      <text x="902" y="219" fill="#b7afd9" font-size="12">Authenticated only through ADC</text>
      <rect x="902" y="238" width="214" height="25" rx="12" fill="#1b1d35"/><text x="1009" y="255" text-anchor="middle" fill="#cfc8ff" font-size="11" font-weight="700">Backend is in media path</text>
      <rect x="874" y="342" width="272" height="160" rx="22" fill="#193638" stroke="#318f83"/>
      <text x="902" y="380" fill="#effffb" font-size="19" font-weight="750">OpenAI</text>
      <text x="902" y="408" fill="#aad5ce" font-size="12">Realtime receives WebRTC audio</text>
      <text x="902" y="435" fill="#aad5ce" font-size="12">Client secret initializes session</text>
      <rect x="902" y="454" width="214" height="25" rx="12" fill="#122729"/><text x="1009" y="471" text-anchor="middle" fill="#baf4e9" font-size="11" font-weight="700">Backend is not media relay</text>
    </g>

    <path d="M340 339H457" stroke="#9c8cff" stroke-width="4" marker-end="url(#violet)"/>
    <text x="398" y="326" text-anchor="middle" fill="#c9c1ff" font-size="11" font-weight="700">Gemini PCM</text>
    <path d="M757 282C810 282 819 206 874 206" fill="none" stroke="#9c8cff" stroke-width="4" marker-end="url(#violet)"/>
    <text x="810" y="251" text-anchor="middle" fill="#c9c1ff" font-size="11" font-weight="700">ADK Live audio</text>
    <path d="M757 421H874" fill="none" stroke="#8c96b4" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#gray)"/>
    <text x="815" y="407" text-anchor="middle" fill="#aab4cf" font-size="11">mint request</text>
    <path d="M483 435H314" fill="none" stroke="#8c96b4" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#gray)"/>
    <text x="399" y="421" text-anchor="middle" fill="#aab4cf" font-size="11">short-lived secret</text>
    <path d="M314 456C475 566 795 566 915 502" fill="none" stroke="#59e1c5" stroke-width="5" marker-end="url(#mint)"/>
    <text x="613" y="584" text-anchor="middle" fill="#8ff0dd" font-size="13" font-weight="750">OpenAI WebRTC audio bypasses FastAPI</text>

    <rect x="54" y="540" width="264" height="61" rx="14" fill="#241b2a" stroke="#6e435c"/>
    <text x="78" y="566" fill="#ffd5df" font-size="13" font-weight="700">Never log by default</text>
    <text x="78" y="587" fill="#d1a8b7" font-size="11">Keys, audio, SDP, full events, transcripts</text>
    <rect x="874" y="540" width="272" height="61" rx="14" fill="#162c2d" stroke="#356d67"/>
    <text x="898" y="566" fill="#c5f7ed" font-size="13" font-weight="700">Provider policies still apply</text>
    <text x="898" y="587" fill="#9fcfc7" font-size="11">Review account data controls before use</text>
  </g>
</svg>
